<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Minerva — ruimte voor heldere ideeën, aandachtig gemaakt.">
  <meta name="theme-color" content="#f4efe7">
  <title>Minerva</title>
  <style>
    :root {
      --ink: #172a33;
      --muted: #627078;
      --paper: #f4efe7;
      --paper-light: #fbfaf7;
      --coral: #d8664e;
      --line: rgba(23, 42, 51, .16);
      --serif: Georgia, 'Times New Roman', serif;
      --sans: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }

    a { color: inherit; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .nav {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--paper-light);
      background: var(--coral);
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0;
    }

    .nav-link {
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .05em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-link:hover, .nav-link:focus-visible { color: var(--coral); }

    main {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, .88fr) minmax(360px, 1.12fr);
      align-items: center;
      gap: clamp(44px, 8vw, 124px);
      padding: clamp(64px, 10vh, 120px) 0 80px;
    }

    .intro { animation: rise .7s ease both; }

    .eyebrow {
      margin: 0 0 25px;
      color: var(--coral);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 600px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(4rem, 8vw, 7.8rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .9;
    }

    .lead {
      max-width: 450px;
      margin: 32px 0 38px;
      color: var(--muted);
      font-size: clamp(1.05rem, 1.5vw, 1.26rem);
      line-height: 1.65;
    }

    .primary-link {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 14px 0;
      border-bottom: 1px solid var(--ink);
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .primary-link span {
      color: var(--coral);
      font-size: 1.45rem;
      line-height: .5;
      transition: transform .2s ease;
    }

    .primary-link:hover span, .primary-link:focus-visible span { transform: translateX(5px); }

    .visual {
      position: relative;
      min-height: 500px;
      animation: reveal .9s .12s ease both;
    }

    .visual::before {
      content: '';
      position: absolute;
      z-index: -1;
      top: 8%;
      left: -10%;
      width: 70%;
      height: 68%;
      border: 1px solid rgba(216, 102, 78, .55);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .visual img {
      width: 77%;
      height: 500px;
      display: block;
      margin-left: auto;
      object-fit: cover;
      object-position: center;
      filter: saturate(.78);
    }

    .caption {
      position: absolute;
      right: 0;
      bottom: 0;
      width: min(250px, 52%);
      padding: 20px 0 0 20px;
      border-top: 1px solid var(--ink);
      background: var(--paper);
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.5;
    }

    footer {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 20px 0 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .04em;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes reveal { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }

    @media (max-width: 760px) {
      .nav, main, footer { width: min(100% - 36px, 560px); }
      .nav { padding: 20px 0; }
      main { display: block; padding: 62px 0 56px; }
      h1 { font-size: clamp(4rem, 20vw, 6.2rem); }
      .lead { margin-top: 25px; }
      .visual { min-height: 390px; margin-top: 72px; }
      .visual img { width: 82%; height: 390px; }
      .visual::before { top: 5%; left: -8%; height: 65%; }
      footer { padding-bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav" aria-label="Hoofdnavigatie">
      <a class="brand" href="/" aria-label="Minerva home">
        <span class="brand-mark" aria-hidden="true">M</span>
        Minerva
      </a>
      <a class="nav-link" href="mailto:info@robmenting.com">Contact</a>
    </nav>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Minerva</h1>
        <p class="lead">Op deze website vind je teksten en vertalingen van de methode Latijn Minerva.</p>
        <a class="primary-link" href="mailto:info@robmenting.com">Neem contact op <span aria-hidden="true">&#8594;</span></a>
      </section>

      <figure class="visual">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Skulptur_der_Minerva.jpg" alt="Beeld van de Romeinse godin Minerva">
        <figcaption class="caption">Minerva, godin van wijsheid, kunsten en wetenschap.</figcaption>
      </figure>
    </main>

    <footer>Minerva &copy; 2026</footer>
  </div>
</body>
</html>
