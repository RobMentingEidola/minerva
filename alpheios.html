<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Alpheios — onderdeel van Minerva.">
  <meta name="theme-color" content="#211918">
  <title>Alpheios | Minerva</title>
  <style>
    :root {
      --ink: #f5ead4;
      --muted: #c7b79c;
      --paper: #211918;
      --paper-light: #fff8e8;
      --gold: #c7943e;
      --burgundy: #792f35;
      --line: rgba(245, 234, 212, .2);
      --serif: Georgia, 'Times New Roman', serif;
      --sans: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }

    a { color: inherit; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .nav, main, footer {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
    }

    .nav {
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--paper-light);
      background: var(--burgundy);
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 400;
    }

    .nav-link {
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .05em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-link:hover, .nav-link:focus-visible { color: var(--gold); }

    main {
      flex: 1;
      display: grid;
      align-content: center;
      min-height: 560px;
      padding: 80px 0;
    }

    .content { max-width: 720px; }

    .eyebrow {
      margin: 0 0 25px;
      color: var(--gold);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .9;
    }

    .lead {
      max-width: 560px;
      margin: 34px 0 42px;
      color: var(--muted);
      font-size: clamp(1.05rem, 1.5vw, 1.26rem);
      line-height: 1.65;
    }

    .text-menu {
      max-width: 560px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .menu-label {
      margin: 0 0 14px;
      color: var(--gold);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .text-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--ink);
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .text-link span { color: var(--gold); font-size: 1.2rem; }
    .text-link:hover, .text-link:focus-visible { color: var(--gold); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--ink);
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link span { color: var(--gold); font-size: 1.35rem; }
    .back-link:hover, .back-link:focus-visible { color: var(--gold); }

    footer {
      padding: 20px 0 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .04em;
    }

    @media (max-width: 760px) {
      .nav, main, footer { width: min(100% - 36px, 560px); }
      .nav { padding: 20px 0; }
      main { min-height: 500px; padding: 62px 0 56px; }
      footer { padding-bottom: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav" aria-label="Hoofdnavigatie">
      <a class="brand" href="index.html" aria-label="Minerva home">
        <span class="brand-mark" aria-hidden="true">M</span>
        Minerva
      </a>
      <a class="nav-link" href="mailto:info@robmenting.com">Contact</a>
    </nav>

    <main>
      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow">Minerva</p>
        <h1 id="page-title">Alpheios</h1>
        <p class="lead">Teksten en vertalingen uit de methode Latijn Minerva.</p>
        <nav class="text-menu" aria-label="Teksten">
          <p class="menu-label">Teksten</p>
          <ul class="text-list">
            <li><a class="text-link" href="teksten/tekst-17a.html" target="_blank" rel="noopener">Tekst 17A <span aria-hidden="true">&#8599;</span></a></li>
            <li><a class="text-link" href="teksten/tekst-17b.html" target="_blank" rel="noopener">Tekst 17B <span aria-hidden="true">&#8599;</span></a></li>
          </ul>
        </nav>
        <a class="back-link" href="index.html"><span aria-hidden="true">&#8592;</span>Terug naar Minerva</a>
      </section>
    </main>

    <footer>Minerva &copy; 2026</footer>
  </div>
</body>
</html>
